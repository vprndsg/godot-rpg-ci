name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export for the web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      # Turns Pages on by itself when the repository lets Actions do it. On a
      # repo whose default workflow token is read-only this is refused with
      # "Resource not accessible by integration", which is not worth failing
      # the build over -- the deploy step below then prints the exact settings
      # link. Enabling Pages by hand once makes this a no-op forever after.
      - name: Configure Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Note if Pages could not be enabled automatically
        if: steps.configure_pages.outcome == 'failure'
        run: |
          echo "::warning::Could not enable Pages from the workflow. Set Settings -> Pages -> Source: GitHub Actions once, then re-run this workflow."

      - uses: ./.github/actions/setup-godot
        with:
          export-templates: "true"

      - name: Import assets
        run: tools/ci.sh import

      - name: Run tests
        # A red build must never reach the published page.
        run: tools/ci.sh test

      - name: Build the web export
        run: tools/ci.sh export

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
