name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only wake up for an actual mention, so ordinary issue chatter is free.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Godot goes in before Claude runs, so Claude can import the project and
      # run the test suite itself rather than guessing and waiting for CI.
      # Export templates are skipped here (they cost ~1.3 GB to fetch); the
      # web build is CI's job on the resulting pull request.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          export-templates: "false"

      - name: Warm the asset import cache
        run: tools/ci.sh import

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Swap the line above for this if you authenticate with a Claude
          # subscription instead of an API key:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(tools/ci.sh:*),Bash(python3 tools/gen_art.py),Bash(git diff:*),Bash(git status:*)"
