name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-godot
        with:
          export-templates: "true"

      - name: Import assets
        run: tools/ci.sh import

      - name: Check the generated files are up to date
        # tiles.json, gen_art.py and any sheet under assets/packs/ are the
        # sources; terrain.png, terrain.tres, CREDITS.md and everything in
        # docs/art/ are built from them. If regenerating changes anything,
        # someone edited a source and forgot to re-run the generators.
        # docs/art/ is covered too so the committed contact sheets always match
        # the art, which is what makes GitHub's image diff on a pull request
        # trustworthy. Imported art does not escape this: a pack's sheet is a
        # source like any other, and terrain.png is still rebuilt from it.
        run: |
          tools/ci.sh generate
          if ! git diff --quiet -- assets/ docs/art/ CREDITS.md; then
            echo "::error::Generated files are stale. Run 'tools/ci.sh generate' and commit the result."
            git diff --stat -- assets/ docs/art/ CREDITS.md
            exit 1
          fi
          echo "generated assets and art sheets are up to date"

      - name: Run tests
        run: tools/ci.sh test

      - name: Build the web export
        run: tools/ci.sh export

      - name: Upload the playable build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: build/web
          retention-days: 7
