name: Set up Godot
description: Install the headless Godot editor (and optionally the web export templates), with caching.

inputs:
  export-templates:
    description: Also install the web export templates. Only the deploy and build jobs need these.
    required: false
    default: "false"

outputs:
  version:
    description: The Godot version that was installed.
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read the pinned Godot version
      id: version
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"

    - name: Restore cached Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          .tools
          ~/.local/share/godot/export_templates
        key: godot-${{ runner.os }}-${{ steps.version.outputs.version }}-templates-${{ inputs.export-templates }}

    - name: Install Godot
      shell: bash
      env:
        # The templates archive is ~1.3 GB to download but only ~85 MB is kept,
        # so the cache above makes every run after the first one cheap.
        WITH_EXPORT_TEMPLATES: ${{ inputs.export-templates == 'true' && '1' || '0' }}
      run: tools/ci.sh setup

    - name: Put Godot on PATH
      shell: bash
      run: echo "GODOT_BIN=$PWD/.tools/godot" >> "$GITHUB_ENV"
